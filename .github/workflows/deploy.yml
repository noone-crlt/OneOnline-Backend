name: Backend CI and update deploy branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  test-build-update-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw test

      - name: Build backend
        run: ./mvnw package -DskipTests

      - name: Update deploy branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:deploy --force
